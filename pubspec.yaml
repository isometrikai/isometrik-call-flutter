name: isometrik_call_flutter
description: "A new Flutter plugin project."
version: 0.0.1
publish_to: none
repository: https://github.com/isometrikai/isometrik-call-flutter

environment:
  sdk: ">=3.4.3 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  cached_network_image: ^3.4.1
  collection: ^1.19.1
  connectivity_plus: ^7.0.0
  custom_will_pop_scope: ^2.1.1
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.3
  flutter_web_plugins:
    sdk: flutter
  flutter_webrtc: ^1.2.1
  fluttertoast: ^9.0.0
  get: ^4.7.3
  http: ^1.6.0
  intl: ^0.20.2
  livekit_client: ^2.6.0
  mqtt_helper:
    git:
      url: https://github.com/rahulsaryam/mqtt_helper.git
      ref: main
  pip_view: ^0.9.7
  plugin_platform_interface: ^2.1.8
  pull_to_refresh: ^2.0.0
  uuid: ^4.5.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: ai.isometrik.isometrik_call_flutter
        pluginClass: IsometrikCallFlutterPlugin
      ios:
        pluginClass: IsometrikCallFlutterPlugin
        swift_version: 5.0
      web:
        pluginClass: IsometrikCallFlutterWeb
        fileName: isometrik_call_flutter_web.dart
  assets:
    - assets/
    - assets/icons/
